# Based on
# https://github.com/theos/sdks/blob/ca52092/.github/workflows/release.yml
name: Release

on:
  push:
    branches:
      - main

jobs:
  release:
    # needed to be able to create a Release
    permissions:
      contents: write
    runs-on: macos-26
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Archive iOS app
        run: |
          xcodebuild \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO \
            archive -scheme HeaderViewer \
            -destination 'generic/platform=iOS' \
            -archivePath ios_archive \
            -quiet

      - name: Package iOS app
        run: |
          mv ios_archive.xcarchive/Products/Applications Payload
          zip -yqr HeaderViewer.ipa Payload

      - name: Archive macOS app
        run: |
          # ad-hoc sign ("-")
          #   1. since Apple silicon won't run unsigned code
          #   2. so the entitlements are embedded
          xcodebuild \
            CODE_SIGN_IDENTITY="-" \
            archive -scheme HeaderViewer \
            -destination 'generic/platform=macOS' \
            -archivePath macos_archive \
            -quiet

      - name: Package macOS app
        run: |
          ditto -c -k --keepParent macos_archive.xcarchive/Products/Applications/HeaderViewer.app HeaderViewer-macOS.zip

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="auto-${GITHUB_SHA:0:7}"
          gh release create "${TAG}" --draft \
            --title "Automatic Release" \
            --target "${GITHUB_SHA}" \
            HeaderViewer.ipa HeaderViewer-macOS.zip
